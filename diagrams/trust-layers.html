<rect x="40" y="96" width="960" height="72" rx="6" fill="#101624"/><rect x="40" y="96" width="960" height="72" rx="6" fill="rgba(142,162,255,0.12)" stroke="#8ea2ff" stroke-width="1.4"/><text x="520.0" y="136.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="64" y="140" font-family="Poppins, sans-serif" font-size="30" fill="#8ea2ff">1</text><text x="110" y="138" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#e8ecf8">Rules decide</text><text x="340" y="128" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">Ladder, risk profile, allocation, gates, caps and scores come from</text><text x="340" y="146" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">deterministic code, each with a full trace.</text><text x="976" y="136" text-anchor="end" font-family="Poppins, sans-serif" font-size="8.5" letter-spacing="0.14em" fill="#8b96b5">BACKEND</text><rect x="40" y="180" width="960" height="72" rx="6" fill="#101624"/><rect x="40" y="180" width="960" height="72" rx="6" fill="#101624" stroke="#e8ecf8" stroke-width="1"/><text x="520.0" y="220.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="64" y="224" font-family="Poppins, sans-serif" font-size="30" fill="#a6b0cc">2</text><text x="110" y="222" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#e8ecf8">Retrieval grounds</text><text x="340" y="212" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">Answers may only use retrieved OJK and IDX passages,</text><text x="340" y="230" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">plus the user&#x27;s own profile and holdings.</text><text x="976" y="220" text-anchor="end" font-family="Poppins, sans-serif" font-size="8.5" letter-spacing="0.14em" fill="#8b96b5">AI SERVICE</text><rect x="40" y="264" width="960" height="72" rx="6" fill="#101624"/><rect x="40" y="264" width="960" height="72" rx="6" fill="#101624" stroke="#e8ecf8" stroke-width="1"/><text x="520.0" y="304.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="64" y="308" font-family="Poppins, sans-serif" font-size="30" fill="#a6b0cc">3</text><text x="110" y="306" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#e8ecf8">The LLM explains</text><text x="340" y="296" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">Gemma writes the wording. It never ranks, allocates, buys or sells.</text><text x="340" y="314" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">It only phrases what the layers above already decided.</text><text x="976" y="304" text-anchor="end" font-family="Poppins, sans-serif" font-size="8.5" letter-spacing="0.14em" fill="#8b96b5">GEMMA</text><rect x="40" y="348" width="960" height="72" rx="6" fill="#101624"/><rect x="40" y="348" width="960" height="72" rx="6" fill="rgba(142,162,255,0.12)" stroke="#8ea2ff" stroke-width="1.4"/><text x="520.0" y="388.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="64" y="392" font-family="Poppins, sans-serif" font-size="30" fill="#8ea2ff">4</text><text x="110" y="390" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#e8ecf8">Guardrail verifies</text><text x="340" y="380" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">Advice words are banned, every number must trace to context, citations in range.</text><text x="340" y="398" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">One retry, then plain source excerpts.</text><text x="976" y="388" text-anchor="end" font-family="Poppins, sans-serif" font-size="8.5" letter-spacing="0.14em" fill="#8b96b5">AI SERVICE</text><rect x="40" y="432" width="960" height="72" rx="6" fill="#101624"/><rect x="40" y="432" width="960" height="72" rx="6" fill="#101624" stroke="#e8ecf8" stroke-width="1"/><text x="520.0" y="472.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="64" y="476" font-family="Poppins, sans-serif" font-size="30" fill="#a6b0cc">5</text><text x="110" y="474" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#e8ecf8">The UI discloses</text><text x="340" y="464" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">Every screen says: not a purchase recommendation, only profiling</text><text x="340" y="482" font-family="Poppins, sans-serif" font-size="12" fill="#a6b0cc">and explanations from sources.</text><text x="976" y="472" text-anchor="end" font-family="Poppins, sans-serif" font-size="8.5" letter-spacing="0.14em" fill="#8b96b5">NEXT.JS</text><line x1="40" y1="556" x2="1000" y2="556" stroke="rgba(232,236,248,0.28)" stroke-width="0.8"/><rect x="40" y="563" width="22" height="14" rx="3" fill="#101624"/><rect x="40" y="563" width="22" height="14" rx="3" fill="rgba(142,162,255,0.12)" stroke="#8ea2ff" stroke-width="1.4"/><text x="51.0" y="574.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="68" y="573" font-family="Poppins, sans-serif" font-size="8.5" fill="#8b96b5">Where trust is decided</text><rect x="206.4" y="563" width="22" height="14" rx="3" fill="#101624"/><rect x="206.4" y="563" width="22" height="14" rx="3" fill="#101624" stroke="#e8ecf8" stroke-width="1"/><text x="217.4" y="574.0" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#e8ecf8"></text><text x="234.4" y="573" font-family="Poppins, sans-serif" font-size="8.5" fill="#8b96b5">Supporting layer</text>
