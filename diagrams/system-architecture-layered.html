<title id="sa2-title">Finpass system architecture by layer</title>
<desc id="sa2-desc">WhatsApp and the Next.js client are the entry points. Next.js calls the Go API over REST with auth. The Go API owns PostgreSQL, imports prices from Yahoo Finance and CoinGecko, sends the daily briefing through a WhatsApp gateway to the WhatsApp Business API, and calls the FastAPI AI service with an internal API key. The AI service searches and reranks passages in an embedded ChromaDB, loads the corpus from Cloudflare R2 at startup, uses OpenRouter for embeddings and completion, and exports traces to Phoenix.</desc>
