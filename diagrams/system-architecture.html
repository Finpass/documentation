<title id="system-architecture-title">Finpass system architecture</title>
<desc id="system-architecture-desc">Next.js talks to a Go API, which owns Postgres and sends WhatsApp messages through Meta WhatsApp Business. The Go API calls a FastAPI RAG service that queries an embedded ChromaDB loaded from R2 and uses OpenRouter for the LLM and bge-m3 embeddings. An offline indexer builds the Chroma folder.</desc>
